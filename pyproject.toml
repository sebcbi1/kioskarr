[project]
name = "kioskarr"
version = "0.1.0"
description = "Radarr/Sonarr-style monitor for magazine (and best-effort newspaper) issues"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "apscheduler>=3.10",
    "rapidfuzz>=3.9",
    "requests>=2.32",
    "pydantic-settings>=2.4",
    "itsdangerous>=2.1",
    "pypdfium2>=4.30",
    "Pillow>=10.0",
    "rarfile>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kioskarr*"]
